name: Build DH Trail Builder APK

on:
  push:
    paths:
      - "dh-trail-builder/**"
      - ".github/workflows/build-dh-trail-builder-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dh-trail-builder
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Read app version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = \"\(.*\)\".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dh-trail-builder-${{ steps.version.outputs.name }}
          path: dh-trail-builder/app/build/outputs/apk/debug/app-debug.apk
