name: Build HD Trail Builder APK

on:
  push:
    paths:
      - "hd-trail-builder/**"
      - ".github/workflows/build-hd-trail-builder-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hd-trail-builder
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hd-trail-builder-debug-apk
          path: hd-trail-builder/app/build/outputs/apk/debug/app-debug.apk
