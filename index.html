<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחיר מניה חי</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #1a1d24;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 20px;
    text-align: center;
    color: #fff;
  }
  .search-row {
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    font-size: 18px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #0f1115;
    color: #fff;
    min-width: 0;
  }
  input:focus { outline: 2px solid #4a7dff; }
  button {
    font-size: 16px;
    padding: 14px 18px;
    border-radius: 10px;
    border: none;
    background: #4a7dff;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:active { background: #3a68e0; }
  button:disabled { background: #333; cursor: default; }
  #result { margin-top: 24px; min-height: 20px; }
  .ticker-name {
    font-size: 16px;
    color: #9aa0ab;
    margin-bottom: 4px;
  }
  .price {
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }
  .change {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .up { color: #3ecf5f; }
  .down { color: #ff5c5c; }
  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 14px;
    color: #9aa0ab;
    border-top: 1px solid #2a2d34;
    padding-top: 14px;
  }
  .details b { color: #ddd; }
  .updated {
    margin-top: 14px;
    font-size: 12px;
    color: #666;
    text-align: center;
  }
  .message {
    text-align: center;
    padding: 20px 0;
    color: #ff9d5c;
    font-size: 15px;
  }
  .message.error { color: #ff5c5c; }
</style>
</head>
<body>

<div class="card">
  <h1>מחיר מניה חי</h1>
  <div class="search-row">
    <input type="text" id="tickerInput" placeholder="לדוגמה: AAPL" autocomplete="off" autocapitalize="characters">
    <button id="searchBtn">בדוק</button>
  </div>
  <div id="result"></div>
</div>

<script>
// ===== מפתח Finnhub — להחליף במפתח האמיתי שלך מ-finnhub.io =====
const API_KEY = "dagrii1r01qomfflj180dagrii1r01qomfflj18g";
// =================================================================

const input = document.getElementById("tickerInput");
const btn = document.getElementById("searchBtn");
const result = document.getElementById("result");

function showMessage(text, isError) {
  result.innerHTML = `<div class="message${isError ? " error" : ""}">${text}</div>`;
}

function formatTime(unixSeconds) {
  const d = new Date(unixSeconds * 1000);
  return d.toLocaleString("he-IL", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
}

async function lookup() {
  const symbol = input.value.trim().toUpperCase();
  if (!symbol) return;

  btn.disabled = true;
  showMessage("טוען...", false);

  try {
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${API_KEY}`);

    if (res.status === 401) {
      showMessage("מפתח ה-API לא תקין", true);
      return;
    }
    if (res.status === 429) {
      showMessage("יותר מדי בקשות, נסה בעוד רגע", true);
      return;
    }
    if (!res.ok) {
      showMessage("שגיאה בשרת, נסה שוב", true);
      return;
    }

    const data = await res.json();

    if (!data.c || data.c === 0) {
      showMessage(`לא נמצאה מניה בשם "${symbol}"`, true);
      return;
    }

    const isUp = data.d >= 0;
    const arrow = isUp ? "▲" : "▼";
    const cls = isUp ? "up" : "down";
    const sign = isUp ? "+" : "";

    result.innerHTML = `
      <div class="ticker-name">${symbol}</div>
      <div class="price">$${data.c.toFixed(2)}</div>
      <div class="change ${cls}">${arrow} ${sign}${data.d.toFixed(2)} (${sign}${data.dp.toFixed(2)}%)</div>
      <div class="details">
        <div>פתיחה: <b>$${data.o.toFixed(2)}</b></div>
        <div>סגירה קודמת: <b>$${data.pc.toFixed(2)}</b></div>
        <div>גבוה היום: <b>$${data.h.toFixed(2)}</b></div>
        <div>נמוך היום: <b>$${data.l.toFixed(2)}</b></div>
      </div>
      <div class="updated">עודכן: ${formatTime(data.t)}</div>
    `;
  } catch (e) {
    showMessage("אין חיבור לאינטרנט", true);
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", lookup);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") lookup();
});
</script>

</body>
</html>
